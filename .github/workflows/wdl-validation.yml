name: WDL validation

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - "README.md"
      - "docs/**/*.md"
      - "scripts/**/*.py"
      - "scripts/**/*.R"
      - "scripts/**/*.sh"
      - "tests/**/*.py"
      - "tests/**/*.json"
      - "tests/fixtures/**"
      - "workflows/**/*.wdl"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - "README.md"
      - "docs/**/*.md"
      - "scripts/**/*.py"
      - "scripts/**/*.R"
      - "scripts/**/*.sh"
      - "tests/**/*.py"
      - "tests/**/*.json"
      - "tests/fixtures/**"
      - "workflows/**/*.wdl"

jobs:
  miniwdl-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bcftools r-base
          python -m pip install --upgrade pip pytest

      - name: Install miniwdl
        run: pipx install miniwdl

      - name: Run lightweight synthetic tests
        run: pytest -q

      - name: Check WDLs
        run: |
          shopt -s globstar nullglob
          wdls=(workflows/**/*.wdl)

          if [ ${#wdls[@]} -eq 0 ]; then
            echo "No WDL files found under workflows/."
            exit 0
          fi

          for wdl in "${wdls[@]}"; do
            echo "Checking ${wdl}"
            miniwdl check "${wdl}"
          done
